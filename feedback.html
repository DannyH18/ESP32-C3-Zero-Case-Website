        <h1>Feedback</h1>
        <p>Share your thoughts on the ESP32-C3 Zero case design.</p>

    <section class="card feedback-card">
        <h2>Feedback Form</h2>
        <form class="feedback-form">
            <label>Name</label>
            <input type="text" placeholder="Your name">

            <label>Email</label>
            <input type="email" placeholder="your@email.com">

            <label>Message</label>
            <textarea rows="5" placeholder="Your feedback"></textarea>

            <button class="btn-primary">Submit Feedback</button>
        </form>
    </section>
